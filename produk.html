<!DOCTYPE html>
<head>
<style>

.container{
  display:flex;
  gap:30px;
  padding:40px;
}

.sidebar{
  width:220px;
  background:#FFF4CC;
  padding:20px;
  border-radius:10px;
}

.produk-grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}
  
</style>
</head>

<body>

<header>
  <h1>Daftar Produk</h1>
</header>

<div class="container">

  <aside class="sidebar">
    <h3>Kategori</h3>

    <ul>
      <li>Plastik PP</li>
      <li>Plastik HD</li>
      <li>Plastik OPP</li>
      <li>Plastik PE</li>
    </ul>
  </aside>

  <main class="produk-grid">

    <div class="card">
      <img src="gambar1.jpg">
      <h3>Plastik PP</h3>
      <p>Rp 55.000</p>
    </div>

    <div class="card">
      <img src="gambar2.jpg">
      <h3>Plastik HD</h3>
      <p>Rp 48.000</p>
    </div>

  </main>

</div>

</body>
